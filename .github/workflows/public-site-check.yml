name: Public site checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [tweets.json]
permissions:
  contents: read
jobs:
  public-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - name: Check ecosystem and graph contracts
        run: |
          node scripts/test-graph-api.js
          node scripts/test-physical-ai-router.js
          node scripts/test-ecosystem.js
          node scripts/test-market-review.js
          node scripts/test-market-live-updates.js
          node scripts/test-market-transactions.js
          node scripts/test-atlas-live-refresh.cjs
          node scripts/test-market-recovery-auth.cjs
          node scripts/test-market-review-auth.js
          node scripts/test-pipeline-health.js
          node scripts/test-collector-retry.js
          node scripts/test-web-collection-health.js
          node scripts/test-gmail-collector-retry.js
          node scripts/test-gmail-prefix-recovery.cjs
      - name: Validate ecosystem SQL in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/ecosystem-sql" @electric-sql/pglite@0.3.14 --no-audit --no-fund
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-ecosystem-sql.js
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-market-review-sql.js
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-market-live-sql.js
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-market-transactions-sql.js
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-market-review-resume.cjs
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-web-collection-sql.js
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-market-recovery-sql.cjs
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-market-review-capacity.cjs
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-hourly-refresh-sql.cjs
          ECOSYSTEM_PGLITE_PATH="$RUNNER_TEMP/ecosystem-sql/node_modules/@electric-sql/pglite" node scripts/test-tyrant-news-sql.cjs
      - name: Check release artifact
        run: node scripts/check-public-release.cjs
